image: node:22-alpine

stages:
  - test
  - build
  - release

## Install stage ###################################################################

install:
  stage: .pre
  script:
    - npm ci --cache .npm --prefer-offline

  cache:
    - key: ${CI_JOB_NAME}
      paths:
        - .npm/
      when: on_success

  artifacts:
    paths:
      - node_modules/

## Test stage ###################################################################

test:
  stage: test
  needs:
    - job: install
  script:
    - npm run test

test-js-build:
  stage: test
  needs:
    - job: install
      artifacts: true
  script:
    - npm run build

lint:
  stage: test
  needs:
    - job: install
      artifacts: true
  script:
    - npm run lint

## Build stage ###################################################################

build:
  stage: build
  script:
    - npm run build
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="${CI_COMMIT_SHORT_SHA}-dev"
      fi

      echo "Building version: ${VERSION}"
    - mv dist "turris-webapps-${VERSION}"
    - cp turris-root.conf turris-webapps-json-cgi "turris-webapps-${VERSION}/"
    - tar cvzf "turris-webapps-${VERSION}.tar.gz" "turris-webapps-${VERSION}"

  artifacts:
    paths:
      - turris-webapps-*.tar.gz

## Release stage ###################################################################

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: "$CI_COMMIT_TAG"
  needs:
    - job: build
      artifacts: true
  before_script:
    - apk update
    - apk add bash curl
  script:
    - .gitlab-ci/release.sh
